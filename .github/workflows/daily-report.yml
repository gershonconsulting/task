name: Daily Report

# Sends the "what happened yesterday" progress report every morning at 11:00 UTC (07:00 ET).
# Requires the repository secret CRON_SECRET to match the CRON_SECRET env var on Cloudflare Pages
# (same secret the weekly report uses). Run it on demand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report endpoint
        run: |
          curl -fsS -X POST https://task.gershoncrm.com/api/cron/daily-report \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

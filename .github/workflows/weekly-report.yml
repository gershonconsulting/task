name: Friday Report

# Every Friday at 12:00 UTC (08:00 ET) each member registered in Task
# (Settings → Team members) receives their own weekly report by e-mail.
# The endpoint sends once per New-York day, so a retry cannot double-send.
# Run it on demand from Actions → Friday Report → Run workflow.
# Optional input "only": send ONE test report to that address (a member or the owner).
on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Test: send one report to this address only (leave empty to send to the whole team)'
        required: false
        default: ''
      member:
        description: 'Test: whose report to render (member id from Settings, e.g. olivier, aina)'
        required: false
        default: ''

jobs:
  send-friday-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Friday report endpoint
        env:
          ONLY: ${{ github.event.inputs.only }}
          MEMBER: ${{ github.event.inputs.member }}
        run: |
          URL="https://task.gershon.ai/api/cron/weekly-report"
          if [ -n "$ONLY" ]; then URL="$URL?only=$(printf '%s' "$ONLY" | jq -sRr @uri)&member=$(printf '%s' "$MEMBER" | jq -sRr @uri)"; fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
